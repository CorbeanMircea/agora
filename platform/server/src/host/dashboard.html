<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGORA — Host Dashboard</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --border: #2d3748;
            --accent: #e2b714;
            --text: #e0e0e0;
            --muted: #888;
            --green: #22c55e;
            --red: #ef4444;
            --indigo: #6366f1;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            display: grid;
            grid-template-columns: 380px 1fr;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
            gap: 0;
        }

        /* ── Header ── */
        header {
            grid-column: 1 / -1;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            color: var(--accent);
        }

        .header-meta {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .conn-indicator {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .conn-dot {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--red);
            transition: background 0.3s;
        }

        .conn-dot.live {
            background: var(--green);
        }

        /* ── Left panel ── */
        .left-panel {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 2rem 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #qr-img {
            width: 260px;
            height: 260px;
            border: 3px solid var(--accent);
            border-radius: 0.75rem;
            background: #fff;
            display: block;
            object-fit: contain;
        }

        .room-code {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 0.35em;
            color: var(--accent);
            text-align: center;
            line-height: 1;
        }

        .room-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            text-align: center;
        }

        .join-url {
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
            word-break: break-all;
        }

        /* ── State badge ── */
        .state-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 1rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: var(--border);
            color: var(--muted);
            transition: background 0.3s, color 0.3s;
        }

        .state-badge.WAITING {
            background: #1e3a5f;
            color: #60a5fa;
        }

        .state-badge.PROMPTING {
            background: #3b2a00;
            color: var(--accent);
        }

        .state-badge.GENERATING {
            background: #1e1b4b;
            color: #a5b4fc;
        }

        .state-badge.REVEALING {
            background: #14532d;
            color: #86efac;
        }

        .state-badge.VOTING {
            background: #4c0519;
            color: #fda4af;
        }

        .state-badge.SCORING {
            background: #431407;
            color: #fdba74;
        }

        .state-badge.GAME_OVER {
            background: #1c1c1c;
            color: var(--muted);
        }

        /* ── Start button ── */
        #btn-start {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 0.625rem;
            background: var(--accent);
            color: var(--bg);
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        #btn-start:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #btn-start:not(:disabled):active {
            transform: scale(0.97);
        }

        #btn-hint {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            min-height: 1.1em;
        }

        /* ── Right panel ── */
        .right-panel {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        /* ── Player list ── */
        #player-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .player-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.7rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.2s ease;
            transition: border-color 0.3s;
        }

        .player-item.inactive {
            opacity: 0.45;
            border-color: transparent;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .player-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--green);
        }

        .player-item.inactive .player-dot {
            background: var(--red);
        }

        .player-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .player-status {
            margin-left: auto;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .empty-hint {
            color: var(--muted);
            font-size: 0.875rem;
            font-style: italic;
            padding: 0.5rem 0;
        }

        /* ── Event log ── */
        #event-log {
            background: #0d0d1a;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: #6b7280;
            height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .log-entry {
            line-height: 1.5;
        }

        .log-entry.info {
            color: #60a5fa;
        }

        .log-entry.ok {
            color: var(--green);
        }

        .log-entry.warn {
            color: var(--accent);
        }

        .log-entry.err {
            color: var(--red);
        }

        /* ── Loading state ── */
        #loading-overlay {
            grid-column: 1 / -1;
            grid-row: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            color: var(--muted);
            font-size: 1rem;
        }

        #loading-overlay.hidden {
            display: none;
        }

        .main-content.hidden {
            display: none;
        }

        .main-content {
            display: contents;
        }

        /* responsive – single column on narrow screens */
        @media (max-width: 820px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }

            .left-panel {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            #qr-img {
                width: 200px;
                height: 200px;
            }

            .room-code {
                font-size: 2.75rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>AGORA</h1>
        <span class="header-meta">Host Dashboard</span>
        <div class="conn-indicator">
            <div class="conn-dot" id="conn-dot"></div>
            <span id="conn-label">Se conectează…</span>
        </div>
    </header>

    <!-- Loading while room is being created -->
    <div id="loading-overlay">
        <p>Se creează camera…</p>
    </div>

    <!-- Main content (hidden until room ready) -->
    <div class="main-content hidden" id="main-content">

        <aside class="left-panel">
            <div class="qr-wrapper">
                <img id="qr-img" src="" alt="QR code pentru jucători" />
                <p class="room-code" id="room-code">----</p>
                <p class="room-label">Cod cameră</p>
                <p class="join-url" id="join-url"></p>
            </div>

            <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
                <span class="section-title">Stare curentă</span>
                <span class="state-badge WAITING" id="state-badge">WAITING</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:0.5rem;">
                <button id="btn-start" disabled>Începe Runda</button>
                <p id="btn-hint">Mai sunt necesari cel puțin 2 jucători.</p>
                <button id="btn-new-room" style="
          margin-top:0.25rem;width:100%;padding:0.5rem;font-size:0.75rem;
          font-weight:600;border:1px solid #2d3748;border-radius:0.5rem;
          background:transparent;color:#888;cursor:pointer;">
                    ↺ Cameră nouă
                </button>
            </div>
        </aside>

        <main class="right-panel">
            <section>
                <p class="section-title">Jucători conectați (<span id="player-count">0</span>)</p>
                <ul id="player-list">
                    <li class="empty-hint" id="empty-hint">Nimeni nu s-a alăturat încă…</li>
                </ul>
            </section>

            <section>
                <p class="section-title">Jurnal evenimente</p>
                <div id="event-log"></div>
            </section>
        </main>

    </div><!-- /#main-content -->

    <!-- Socket.IO client from CDN -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        (function () {
            'use strict';

            // ── State ────────────────────────────────────────────────────────────────
            // Persist the room code in sessionStorage so a page refresh reconnects
            // to the same room rather than creating a new one.
            let roomCode = sessionStorage.getItem('host_roomCode') ?? null;
            let roomState = 'WAITING';
            // Map: id → { id, nickname, active }
            const players = new Map();

            // ── DOM refs ─────────────────────────────────────────────────────────────
            const $loadingOverlay = document.getElementById('loading-overlay');
            const $mainContent = document.getElementById('main-content');
            const $connDot = document.getElementById('conn-dot');
            const $connLabel = document.getElementById('conn-label');
            const $roomCodeEl = document.getElementById('room-code');
            const $joinUrl = document.getElementById('join-url');
            const $qrImg = document.getElementById('qr-img');
            const $stateBadge = document.getElementById('state-badge');
            const $btnStart = document.getElementById('btn-start');
            const $btnHint = document.getElementById('btn-hint');
            const $playerList = document.getElementById('player-list');
            const $playerCount = document.getElementById('player-count');
            const $emptyHint = document.getElementById('empty-hint');
            const $eventLog = document.getElementById('event-log');

            // ── Logging ──────────────────────────────────────────────────────────────
            function log(msg, level = 'info') {
                const entry = document.createElement('div');
                entry.className = 'log-entry ' + level;
                const ts = new Date().toLocaleTimeString('ro-RO', { hour12: false });
                entry.textContent = '[' + ts + '] ' + msg;
                $eventLog.appendChild(entry);
                $eventLog.scrollTop = $eventLog.scrollHeight;
            }

            // ── UI helpers ───────────────────────────────────────────────────────────
            function updateStartButton() {
                const activePlayers = [...players.values()].filter(p => p.active).length;
                const canStart = activePlayers >= 2 && roomState === 'WAITING';
                $btnStart.disabled = !canStart;

                if (roomState !== 'WAITING') {
                    $btnHint.textContent = 'Runda este în desfășurare.';
                } else if (activePlayers < 2) {
                    const needed = 2 - activePlayers;
                    $btnHint.textContent =
                        'Mai sunt necesari ' + needed + ' jucător' + (needed === 1 ? '.' : 'i.');
                } else {
                    $btnHint.textContent = activePlayers + ' jucători conectați — gata de start!';
                }
            }

            function renderPlayers() {
                // Remove all dynamic items (keep empty-hint)
                [...$playerList.querySelectorAll('.player-item')].forEach(el => el.remove());

                const list = [...players.values()];
                const activeCount = list.filter(p => p.active).length;
                $playerCount.textContent = activeCount + '/' + list.length;

                if (list.length === 0) {
                    $emptyHint.style.display = '';
                } else {
                    $emptyHint.style.display = 'none';
                    list.forEach(p => {
                        const li = document.createElement('li');
                        li.className = 'player-item' + (p.active ? '' : ' inactive');
                        li.dataset.id = p.id;
                        li.innerHTML =
                            '<div class="player-dot"></div>' +
                            '<span class="player-name">' + escHtml(p.nickname) + '</span>' +
                            '<span class="player-status">' + (p.active ? 'conectat' : 'deconectat') + '</span>';
                        $playerList.appendChild(li);
                    });
                }

                updateStartButton();
            }

            function setRoomState(state) {
                roomState = state;
                $stateBadge.textContent = state;
                $stateBadge.className = 'state-badge ' + state;
                updateStartButton();
            }

            function escHtml(str) {
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // ── Room creation ────────────────────────────────────────────────────────
            async function createRoom() {
                log('Creare cameră nouă…');
                try {
                    const res = await fetch('/rooms', { method: 'POST' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    roomCode = data.code;
                    sessionStorage.setItem('host_roomCode', roomCode);

                    $roomCodeEl.textContent = roomCode;
                    $joinUrl.textContent = data.joinUrl;

                    // Load QR image
                    $qrImg.src = '/rooms/' + roomCode + '/qr';
                    $qrImg.alt = 'QR pentru ' + roomCode;

                    log('Cameră creată: ' + roomCode, 'ok');

                    // Show main content
                    $loadingOverlay.classList.add('hidden');
                    $mainContent.classList.remove('hidden');

                    // Join the Socket.IO room as host (we don't emit player:join — just subscribe)
                    socket.emit('host:watch', { roomCode });

                } catch (err) {
                    log('Eroare la crearea camerei: ' + err.message, 'err');
                    $loadingOverlay.querySelector('p').textContent =
                        'Eroare: nu s-a putut crea camera. Reîncarcă pagina.';
                }
            }

            // ── Socket.IO ────────────────────────────────────────────────────────────
            const socket = io({ transports: ['websocket'] });

            socket.on('connect', () => {
                $connDot.classList.add('live');
                $connLabel.textContent = 'Conectat';
                log('Socket conectat: ' + socket.id, 'ok');

                if (roomCode === null) {
                    // No existing room — create a fresh one
                    createRoom();
                } else {
                    // Reconnect to existing room (page refresh)
                    log('Reconectare la camera existentă: ' + roomCode, 'info');
                    $roomCodeEl.textContent = roomCode;
                    $qrImg.src = '/rooms/' + roomCode + '/qr';

                    // Restore join URL — derive it from the QR endpoint response if needed
                    // For now rebuild it from window.location
                    const baseUrl = window.location.protocol + '//' + window.location.host;
                    $joinUrl.textContent = baseUrl + '/phone/join?room=' + roomCode;

                    // Show main content immediately
                    $loadingOverlay.classList.add('hidden');
                    $mainContent.classList.remove('hidden');

                    // Re-watch the room
                    socket.emit('host:watch', { roomCode });
                }
            });

            socket.on('disconnect', () => {
                $connDot.classList.remove('live');
                $connLabel.textContent = 'Deconectat';
                log('Socket deconectat', 'warn');
            });

            socket.on('player:joined', (data) => {
                // data.players is the full active list from the server
                // Merge into our map (preserves inactive players we may have tracked)
                const activeIds = new Set(data.players.map(p => p.id));

                data.players.forEach(p => {
                    players.set(p.id, { id: p.id, nickname: p.nickname, active: true });
                });

                // Mark any previously known player as inactive if not in this list
                players.forEach((p, id) => {
                    if (!activeIds.has(id)) p.active = false;
                });

                log('Jucător alăturat. Total activi: ' + data.players.length, 'info');
                renderPlayers();
            });

            socket.on('player:disconnected', (data) => {
                const p = players.get(data.playerId);
                if (p) {
                    p.active = false;
                    log(data.nickname + ' s-a deconectat', 'warn');
                    renderPlayers();
                }
            });

            socket.on('player:reconnected', (data) => {
                players.set(data.playerId, {
                    id: data.playerId,
                    nickname: data.nickname,
                    active: true,
                });
                log(data.nickname + ' s-a reconectat', 'ok');
                renderPlayers();
            });

            // Round state events
            ['round:waiting', 'round:prompting', 'round:generating',
                'round:revealing', 'round:voting', 'round:scoring', 'round:game_over']
                .forEach(ev => {
                    socket.on(ev, (data) => {
                        const newState = (data && data.state) ? data.state : ev.split(':')[1].toUpperCase();
                        setRoomState(newState);
                        log('Stare nouă: ' + newState +
                            (data && data.roundNumber ? ' (runda ' + data.roundNumber + ')' : ''), 'info');
                    });
                });

            socket.on('timer:tick', (data) => {
                // Update hint with remaining time during timed phases
                if (roomState === 'PROMPTING' || roomState === 'VOTING') {
                    const m = Math.floor(data.remaining / 60);
                    const s = data.remaining % 60;
                    $btnHint.textContent = 'Timp rămas: ' + m + ':' + String(s).padStart(2, '0');
                }
            });

            socket.on('timer:expired', (data) => {
                log('Timer expirat (' + data.phase + ') → ' + data.advancedTo, 'warn');
            });

            // Sent by server immediately after host:watch to sync current room state
            socket.on('host:state', (data) => {
                if (data && data.state) {
                    setRoomState(data.state);
                    log('Stare sincronizată: ' + data.state, 'info');
                }
            });

            // ── Start Round button ───────────────────────────────────────────────────
            $btnStart.addEventListener('click', () => {
                if (!roomCode || $btnStart.disabled) return;
                $btnStart.disabled = true;
                log('Trimitere round:start…', 'info');

                socket.emit('round:start', { roomCode }, (ack) => {
                    if (ack && ack.ok) {
                        log('Runda a început! Stare: ' + ack.state, 'ok');
                    } else {
                        log('Eroare start rundă: ' + (ack && ack.error ? ack.error : 'necunoscută'), 'err');
                        updateStartButton(); // re-enable if appropriate
                    }
                });
            });

            document.getElementById('btn-new-room').addEventListener('click', () => {
                if (!confirm('Creezi o cameră nouă? Jucătorii actuali vor pierde conexiunea.')) return;
                sessionStorage.removeItem('host_roomCode');
                roomCode = null;
                players.clear();
                $loadingOverlay.classList.remove('hidden');
                $mainContent.classList.add('hidden');
                createRoom();
            });

        })();

    </script>
</body>

</html>
